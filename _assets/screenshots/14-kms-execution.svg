<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#0b1220"/><rect width="1200" height="58" fill="#111c2e"/><circle cx="28" cy="29" r="7" fill="#f87171"/><circle cx="52" cy="29" r="7" fill="#fbbf24"/><circle cx="76" cy="29" r="7" fill="#34d399"/><text x="108" y="36" fill="#dbeafe" font-family="Arial" font-size="20">CLOUD SECURITY LAB / SIMULATED TRAINING SCREEN</text><text x="48" y="112" fill="#f8fafc" font-family="Arial" font-size="30" font-weight="bold">Encryption and key metadata review</text><text x="48" y="148" fill="#94a3b8" font-family="Arial" font-size="18">KMS / Key Vault / Cloud KMS</text><rect x="48" y="182" width="1104" height="405" rx="12" fill="#050b14" stroke="#334155"/><text x="76" y="236" fill="#cbd5e1" font-family="monospace" font-size="18">$ aws kms describe-key --key-id alias/lab-storage-key</text><text x="76" y="284" fill="#cbd5e1" font-family="monospace" font-size="18">KeyState: Enabled   KeyManager: CUSTOMER</text><text x="76" y="332" fill="#cbd5e1" font-family="monospace" font-size="18">$ az keyvault show --name kv-lab-training</text><text x="76" y="380" fill="#cbd5e1" font-family="monospace" font-size="18">purgeProtection: true   softDelete: true</text><text x="76" y="428" fill="#cbd5e1" font-family="monospace" font-size="18">$ gcloud kms keys describe lab-key --keyring=training</text><text x="76" y="476" fill="#fbbf24" font-family="monospace" font-size="18">rotationPeriod: configured   purpose: ENCRYPT_DECRYPT</text><rect x="48" y="610" width="1104" height="44" rx="8" fill="#3f1d25"/><text x="70" y="639" fill="#fecaca" font-family="Arial" font-size="17" font-weight="bold">SIMULATED EXAMPLE — FICTIONAL DATA — NOT LIVE CLOUD EVIDENCE</text><text x="1150" y="676" text-anchor="end" fill="#64748b" font-family="Arial" font-size="13">Command execution</text></svg>