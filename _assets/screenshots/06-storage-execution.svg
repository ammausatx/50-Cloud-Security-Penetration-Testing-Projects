<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#0b1220"/><rect x="0" y="0" width="1200" height="58" fill="#111c2e"/><circle cx="28" cy="29" r="7" fill="#f87171"/><circle cx="52" cy="29" r="7" fill="#fbbf24"/><circle cx="76" cy="29" r="7" fill="#34d399"/><text x="108" y="36" fill="#dbeafe" font-family="Arial" font-size="20">CLOUD SECURITY LAB  /  SIMULATED TRAINING SCREEN</text><text x="48" y="112" fill="#f8fafc" font-family="Arial" font-size="30" font-weight="bold">Storage posture inspection</text><text x="48" y="148" fill="#94a3b8" font-family="Arial" font-size="18">AWS S3 / Azure Blob / Google Cloud Storage</text><rect x="48" y="182" width="1104" height="405" rx="12" fill="#050b14" stroke="#334155"/><text x="76" y="222" fill="#67e8f9" font-family="monospace" font-size="17">assessment@cloud-lab:~$ review --scope authorized-lab --read-only</text><text x="76" y="270" fill="#cbd5e1" font-family="monospace" font-size="18">$ aws s3api get-public-access-block --bucket lab-evidence-bucket</text><text x="76" y="318" fill="#cbd5e1" font-family="monospace" font-size="18">BLOCK_PUBLIC_ACLS: true   BLOCK_PUBLIC_POLICY: true</text><text x="76" y="366" fill="#cbd5e1" font-family="monospace" font-size="18">$ az storage account show --name labstorage01 --query allowBlobPublicAccess</text><text x="76" y="414" fill="#cbd5e1" font-family="monospace" font-size="18">allowBlobPublicAccess: false   httpsOnly: true</text><text x="76" y="462" fill="#cbd5e1" font-family="monospace" font-size="18">$ gcloud storage buckets describe gs://lab-training-bucket</text><text x="76" y="510" fill="#fbbf24" font-family="monospace" font-size="18">uniformBucketLevelAccess: enabled   publicAccessPrevention: enforced</text><rect x="48" y="610" width="1104" height="44" rx="8" fill="#3f1d25"/><text x="70" y="639" fill="#fecaca" font-family="Arial" font-size="17" font-weight="bold">SIMULATED EXAMPLE — FICTIONAL DATA — NOT LIVE CLOUD EVIDENCE</text><text x="1150" y="676" text-anchor="end" fill="#64748b" font-family="Arial" font-size="13">Project 06 / command execution</text></svg>